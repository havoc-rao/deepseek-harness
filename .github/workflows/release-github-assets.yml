# Build the whole dsh release family and upload the packed tarballs to a GitHub
# Release, so another machine (this account's, or any with repo read access) can
# install the CLI from that release without an npm registry account.
#
# This is the self-hosted distribution path for the private dsh scope: the
# official `@deepseek-ai/dsh` family is `restricted` on npmjs, and a fork cannot
# republish that scope, so the packed tarballs travel as release assets instead.
# It reuses the same release machinery as the npm path (`release.yml` /
# `release-publish.yml`): one version across the family, pack is credential-free,
# and `verify-packed-install` proves the tarballs install and `dsh --version`
# runs before anything is uploaded.
#
# A release is a `dsh-v<version>` tag: push the tag and this workflow builds,
# packs, verifies, and uploads every tarball to a GitHub release of the same
# name. The version comes from the tag, so the tree must already carry it (run
# `pnpm run release:dsh <version>` and push the commit first). The workflow
# also stays manually triggerable for a re-run or a version already on the tree.
#
# Only *.tgz assets are uploaded; the companion `publish-order.txt` files stay
# local. The install script on the other machine reads the assets by contents,
# exactly like `verify-packed-install.ts`.
name: Release dsh to GitHub

on:
  push:
    tags: ['dsh-v*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release for a manual run (x.y.z or a prerelease such as
          0.1.2-rc.1); the tree must already carry it. Ignored on tag pushes.
        required: false
        default: ''
      skip-bump:
        description: >-
          Deprecated; versions come from the tag or this input. Kept for
          workflow compatibility; the tree version is always used as-is.
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: Release-github-assets
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  release:
    name: Pack and upload dsh release assets
    runs-on: ubuntu-24.04
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # This fork links @havocrao/dsh-code-finder to a sibling repository (root
      # package.json: link:../DSH-code-finder). The sibling lives at
      # $GITHUB_WORKSPACE/../DSH-code-finder in the runner layout, so clone it
      # there before pnpm install resolves the link. It is a public repo; keep
      # the input so a private sibling can carry a token later.
      - name: Materialize sibling @havocrao/dsh-code-finder
        run: |
          set -euo pipefail
          sibling="$GITHUB_WORKSPACE/../DSH-code-finder"
          if [ ! -d "$sibling/.git" ]; then
            git clone --depth 1 https://github.com/havoc-rao/DSH-code-finder.git "$sibling"
          fi
          # The sibling ships no committed build output (lib/ is gitignored), so
          # install and build it for the tsdown import to resolve.
          (cd "$sibling" && npm install --no-audit --no-fund --package-lock=false && npm run build)

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The release version is the tag name (dsh-v0.1.2 -> 0.1.2) on a tag
      # push, or the workflow input on a manual run; otherwise the tree's own
      # version. The tree must already carry it — no bump happens here.
      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#dsh-v}"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=dsh-v$version" >> "$GITHUB_OUTPUT"

      - name: Verify tree version matches the release version
        run: |
          set -euo pipefail
          tree="$(node -p "require('./package.json').version")"
          if [ "$tree" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json version is $tree but releasing ${{ steps.version.outputs.version }}; run 'pnpm run release:dsh ${{ steps.version.outputs.version }}' and push first"
            exit 1
          fi

      - name: Verify release version
        run: pnpm run release:verify --family dsh

      - name: Build
        run: pnpm run build:official

      # Self-hosted release packaging: excludes this fork's personal-scope
      # plugin (workspace-logo) and the private electron app from the npm-style
      # family pack, strips the dev-only code-finder link from dsh-web-app, packs
      # electron on its own, and verifies the packed install. See
      # scripts/release-github.mjs.
      - name: Pack release tarballs (dsh + electron)
        run: node scripts/release-github.mjs

      - name: Create GitHub Release with tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dsh-v${{ steps.version.outputs.version }}"
          assets=(dist/github/npm/*.tgz dist/github/vendor/*.tgz dist/github/landlock/*.tgz dist/github/electron/*.tgz)
          # The installer reads the release through this manifest when the API
          # is unreachable, so the asset list must ship as an asset itself.
          manifest="dist/github/tarballs.txt"
          (cd dist/github && find npm vendor landlock electron -name '*.tgz' -exec basename {} \; | sort) > "$manifest"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::Release $tag already exists; uploading assets."
            gh release upload "$tag" "${assets[@]}" "$manifest" --clobber
          else
            gh release create "$tag" "${assets[@]}" "$manifest" \
              --title "dsh ${{ steps.version.outputs.version }}" \
              --notes "dsh ${{ steps.version.outputs.version }} release tarballs. Install on another machine with: bash scripts/install-dsh-from-github-release.sh --tag $tag"
          fi
